# Blueprint GRATUITO do Render: so o servico web, no plano free. O banco NAO e criado aqui: o banco gratuito do Render expira
# em 30 dias, entao usamos um PostgreSQL gratuito e permanente de outro provedor (Neon) e colamos a URL em DATABASE_URL.
# Passo a passo em docs/operacao/tutorial-primeiro-deploy.md. Para o desenho pago (web sempre ligado + banco com backup),
# veja render.pago.yaml.
#
# Plano free do Render: o servico dorme depois de ~15 min sem acesso. Um monitor gratuito que acessa /healthz a cada 5 minutos
# (por exemplo UptimeRobot) o mantem acordado; 750 horas por mes cobrem um servico ligado o mes inteiro.

services:
  - type: web
    name: biomedical-data-digger
    runtime: python
    region: virginia
    plan: free
    rootDir: biomedical-article-summariser
    buildCommand: pip install -r requirements.txt
    startCommand: python biomedical_data_digger.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      # URL do PostgreSQL (Neon): use a conexao DIRETA (sem "-pooler" no endereco), com ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # URL publica do site (https, sem barra no fim): base dos links dos e-mails. Obrigatoria se SMTP_HOST estiver definido.
      - key: APP_BASE_URL
        sync: false
      # E-mail transacional (confirmacao de endereco e recuperacao de senha). Sem SMTP_HOST, esses recursos ficam desligados.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Identificacao exigida pelos Termos de Uso e pela Politica de Privacidade (o servico nao sobe sem estas duas em producao)
      - key: LEGAL_CONTROLLER
        sync: false
      - key: LEGAL_CONTACT
        sync: false
      - key: LEGAL_FORUM
        sync: false
      # Quem ve a aba de Administracao: e-mails separados por virgula (em producao, com o e-mail confirmado)
      - key: ADMIN_EMAILS
        sync: false
      # Planos e pagamento por Pix. Com BILLING_ENFORCED=1 os limites do plano gratuito passam a valer (exige PIX_KEY e PIX_NAME).
      - key: BILLING_ENFORCED
        value: "0"
      - key: PIX_KEY
        sync: false
      - key: PIX_NAME
        sync: false
      - key: PIX_CITY
        sync: false
      - key: PRO_PRICE_CENTS
        value: "2900"
      # Laboratorio de IA (opcional)
      - key: GROQ_API_KEY
        sync: false
      # Rotina agendada de avisos e feed, e acesso de emergencia ao painel (>= 24 caracteres cada)
      - key: ALERTS_CRON_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
