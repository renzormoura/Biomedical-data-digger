[project]
name = "nexus-science"
version = "0.3.0"
description = "Analise de artigos cientificos com LLMs, com verificacao de fidelidade a fonte."
requires-python = ">=3.10"
readme = "nexus-science/README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["nexus-science", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: chama servicos externos reais (LLM); desativado por padrao",
    "sqlite_only: comportamento especifico do SQLite; pulado quando TEST_POSTGRES_URL esta definida",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["nexus-science"]
omit = ["*/nexus_science.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["nexus-science", "tests"]
extend-exclude = ["*.ipynb", ".venv_local", "biomedical-article_summarizer", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PIE", "S"]
ignore = [
    "E501",    # texto de prompt e UI em portugues e naturalmente longo
    "S101",    # assert em testes
    "UP007",   # manter compatibilidade de estilo com Optional
    "UP045",
    "S113",    # timeouts ja sao verificados por revisao/testes
    "RET505",
    "SIM108",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM"]
"evals/*" = ["S"]

