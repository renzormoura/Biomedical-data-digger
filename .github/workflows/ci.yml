name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            nexus-science/requirements.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check nexus-science tests evals scripts
      - name: Types (mypy)
        run: mypy
      - name: Tests + coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testes do frontend (node:test)
        run: node --test tests/js/browse-lib.test.js prototype/navegador/tests/lib.test.js
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r nexus-science/requirements.txt
        continue-on-error: true

  postgres:
    # Mesma suite, mas contra PostgreSQL de verdade (o banco de producao): pega diferencas de SQL que o SQLite esconde.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:ci_only_password@127.0.0.1:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            nexus-science/requirements.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests em PostgreSQL
        run: pytest --no-cov
