[project]
name = "biomedical-data-digger"
version = "0.3.0"
description = "Analise de artigos cientificos com LLMs, com verificacao de fidelidade a fonte."
requires-python = ">=3.10"
readme = "biomedical-article-summariser/README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["biomedical-article-summariser", "tests"]
addopts = "-ra --strict-markers"
markers = ["live: chama servicos externos reais (LLM); desativado por padrao"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["biomedical-article-summariser"]
omit = ["*/biomedical_data_digger.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["biomedical-article-summariser", "tests"]
extend-exclude = ["*.ipynb", ".venv_local", "biomedical-article_summarizer", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PIE", "S"]
ignore = [
    "E501",    # texto de prompt e UI em portugues e naturalmente longo
    "S101",    # assert em testes
    "UP007",   # manter compatibilidade de estilo com Optional
    "UP045",
    "S113",    # timeouts ja sao verificados por revisao/testes
    "RET505",
    "SIM108",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM"]
"evals/*" = ["S"]

[tool.mypy]
python_version = "3.10"
mypy_path = "biomedical-article-summariser"
files = [
    "biomedical-article-summariser/security.py",
    "biomedical-article-summariser/ratelimit.py",
    "biomedical-article-summariser/cache.py",
    "biomedical-article-summariser/domain.py",
    "biomedical-article-summariser/grounding.py",
    "biomedical-article-summariser/config.py",
    "biomedical-article-summariser/llm_service.py",
    "biomedical-article-summariser/workflow.py",
    "biomedical-article-summariser/markdown_lite.py",
    "biomedical-article-summariser/sessions.py",
    "biomedical-article-summariser/presentation.py",
    "biomedical-article-summariser/citations.py",
    "biomedical-article-summariser/web.py",
    "biomedical-article-summariser/usage.py",
    "biomedical-article-summariser/quota.py",
    "biomedical-article-summariser/generation.py",
    "biomedical-article-summariser/injection.py",
    "biomedical-article-summariser/extraction.py",
    "biomedical-article-summariser/extraction_view.py",
    "biomedical-article-summariser/europepmc.py",
    "biomedical-article-summariser/catalog.py",
    "biomedical-article-summariser/europepmc_catalog.py",
    "biomedical-article-summariser/openalex_catalog.py",
    "biomedical-article-summariser/discovery.py",
    "biomedical-article-summariser/browse_api.py",
    "biomedical-article-summariser/db.py",
    "biomedical-article-summariser/library_store.py",
    "biomedical-article-summariser/alerts.py",
    "biomedical-article-summariser/reports.py",
    "biomedical-article-summariser/report_brasil.py",
    "biomedical-article-summariser/interests.py",
    "biomedical-article-summariser/exports.py",
    "biomedical-article-summariser/xmlutil.py",
    "biomedical-article-summariser/brasil/__init__.py",
    "biomedical-article-summariser/brasil/conitec.py",
    "biomedical-article-summariser/brasil/nomes.py",
    "biomedical-article-summariser/brasil/anvisa.py",
    "biomedical-article-summariser/brasil/rename.py",
    "biomedical-article-summariser/brasil/rename_build.py",
    "biomedical-article-summariser/brasil/anvisa_build.py",
    "biomedical-article-summariser/brasil/consulta.py",
    "biomedical-article-summariser/brasil/conitec_build.py",
    "biomedical-article-summariser/downloads.py",
    "biomedical-article-summariser/arxiv_catalog.py",
    "biomedical-article-summariser/doaj_catalog.py",
    "biomedical-article-summariser/openaire_catalog.py",
    "biomedical-article-summariser/pubmed_catalog.py",
    "biomedical-article-summariser/enrichment.py",
    "biomedical-article-summariser/reliability.py",
